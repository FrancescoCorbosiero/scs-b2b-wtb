name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: composer check (test + PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_sqlite, gd, zip, curl, mbstring
          coverage: none
          tools: composer:v2
      - name: Dipendenze
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Test e analisi statica
        run: composer check
  assets:
    name: build degli asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
