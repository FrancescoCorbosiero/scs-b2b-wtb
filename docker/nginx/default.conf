# nginx davanti a php-fpm, dietro Caddy Docker Proxy (docs/02, docs/09).

# Solo le pagine di presentazione sono indicizzabili; tutto il resto noindex.
map $uri $robots_tag {
    default             "noindex, nofollow";
    "/"                 "";
    "/come-ordinare"    "";
    "/spedizioni"       "";
    "/contatti"         "";
    "/richiedi-accesso" "";
}

# HTTPS come lo vede Caddy (unico che può raggiungere questo container).
map $http_x_forwarded_proto $forwarded_https {
    default "";
    https   "on";
}

server {
    listen 80;
    server_name _;
    root /var/www/public;
    server_tokens off;
    client_max_body_size 2m;

    # IP reale del cliente: X-Forwarded-For SOLO dalle subnet delle network docker (Caddy).
    # Se la network "caddy" usa un'altra subnet, aggiungila qui (docker network inspect caddy).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag $robots_tag always;

    location = /robots.txt { try_files $uri =404; }
    location = /favicon.svg { try_files $uri =404; expires 7d; }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param HTTPS $forwarded_https;
        fastcgi_read_timeout 120s;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
